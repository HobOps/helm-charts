# Kind fixture for MetalLB BGPPeer (metallb.io/v1beta2, namespaced). Schema
# defaults (peerPort, disableMP, dualStackAddressFamily) are set explicitly.
BGPPeer:
  ci-peer-v4:
    myASN: 64620
    peerASN: 65101
    peerAddress: 192.0.2.1
    peerPort: 179
    holdTime: 9s
    keepaliveTime: 3s
    bfdProfile: ci-bfd
    disableMP: false
    dualStackAddressFamily: false
  ci-peer-v6:
    myASN: 64620
    peerASN: 65101
    peerAddress: "2001:db8::1"
    peerPort: 179
    disableMP: false
    dualStackAddressFamily: false
    nodeSelectors:
    - matchLabels:
        kubernetes.io/os: linux
