RabbitmqCluster:
  ci-topology-rmq:
    annotations:
      hobops.io/ci: "true"
    replicas: 1
    persistence:
      storage: "0"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 100m
        memory: 256Mi

User:
  ci-user:
    annotations:
      hobops.io/ci: "true"
    tags:
      - management
    rabbitmqClusterReference:
      name: ci-topology-rmq
