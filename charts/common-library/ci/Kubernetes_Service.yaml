# Kind-schedulable fixture for standalone Service.
Service:
  ci-service:
    annotations:
      hobops.io/ci: "true"
    labels:
      app: ci-service
    selectorLabels:
      app: ci-service
    type: ClusterIP
    ports:
    - name: http
      port: 80
      protocol: TCP
  # LoadBalancer fields accepted by the API server without an LB controller
  # (stays Pending). SingleStack: Kind clusters are IPv4-only by default.
  ci-service-lb:
    labels:
      app: ci-service-lb
    selectorLabels:
      app: ci-service-lb
    type: LoadBalancer
    ipFamilyPolicy: SingleStack
    ipFamilies:
    - IPv4
    externalTrafficPolicy: Local
    loadBalancerClass: io.cilium/bgp-control-plane
    allocateLoadBalancerNodePorts: false
    loadBalancerSourceRanges:
    - 10.0.0.0/8
    ports:
    - name: https
      port: 443
      protocol: TCP
