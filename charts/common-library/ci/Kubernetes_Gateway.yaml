# Kind fixture for Gateway (uses Ingress/Gateway class stub from prereqs).
Gateway:
  ci-gateway:
    annotations:
      hobops.io/ci: "true"
    labels:
      app: ci-gateway
    gatewayClassName: traefik
    infrastructure:
      labels:
        lb-pool: gateway
      annotations:
        lbipam.cilium.io/ips: 192.0.2.29
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
