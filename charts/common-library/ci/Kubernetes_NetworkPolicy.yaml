# Kind-schedulable fixture for NetworkPolicy.
NetworkPolicy:
  ci-networkpolicy:
    annotations:
      hobops.io/ci: "true"
    podSelector:
      matchLabels:
        app: ci-networkpolicy
    policyTypes:
    - Ingress
    ingress:
    - from:
      - podSelector:
          matchLabels:
            app: ci-networkpolicy-client
      ports:
      - protocol: TCP
        port: 80
  ci-networkpolicy-default-deny:
    policyTypes:
    - Ingress
    - Egress
  ci-networkpolicy-egress-dns:
    podSelector:
      matchLabels:
        app: ci-networkpolicy
    policyTypes:
    - Egress
    egress:
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: UDP
        port: 53
