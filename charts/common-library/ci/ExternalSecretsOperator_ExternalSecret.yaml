# Kind fixture for ExternalSecret (+ companion SecretStore with fake provider).
# Includes target.template with ESO placeholders that must not be emptied by Helm.
SecretStore:
  ci-externalsecret-store:
    annotations:
      hobops.io/ci: "true"
    provider:
      fake:
        data:
        - key: /ci/external
          value: kind-ci
          version: "1"
        - key: rabbitmq
          value: '{"RABBITMQ_USER":"ci","RABBITMQ_PASSWORD":"ci"}'
          version: "1"

ExternalSecret:
  ci-externalsecret:
    annotations:
      hobops.io/ci: "true"
    labels:
      app: ci-externalsecret
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: ci-externalsecret-store
    dataFrom:
    - extract:
        key: /ci/external

  ci-externalsecret-template:
    annotations:
      hobops.io/ci: "true"
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: ci-externalsecret-store
    target:
      name: ci-rabbitmq-credentials
      creationPolicy: Owner
      template:
        engineVersion: v2
        data:
          username: "{{ .RABBITMQ_USER }}"
          password: "{{ .RABBITMQ_PASSWORD }}"
          default_user.conf: |
            default_user = {{ .RABBITMQ_USER }}
            default_pass = {{ .RABBITMQ_PASSWORD }}
    dataFrom:
    - extract:
        key: rabbitmq
