# Kind fixture for Cilium CiliumBGPPeerConfig. Schema defaults (ebgpMultihop,
# timers, restartTimeSeconds) are set explicitly so render and live object match.
CiliumBGPPeerConfig:
  ci-bgp-peer:
    labels:
      hobops.io/ci: "true"
    ebgpMultihop: 1
    timers:
      connectRetryTimeSeconds: 12
      holdTimeSeconds: 9
      keepAliveTimeSeconds: 3
    gracefulRestart:
      enabled: true
      restartTimeSeconds: 120
    families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: ci
