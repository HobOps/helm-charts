# Kind fixture for LimitRange (canonical quantities).
LimitRange:
  ci-limitrange:
    labels:
      hobops.io/ci: "true"
    limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
