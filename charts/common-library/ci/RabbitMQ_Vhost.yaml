# Kind fixture: Messaging Topology Operator Vhost (+ companion RabbitmqCluster).
RabbitmqCluster:
  ci-topology-rmq:
    annotations:
      hobops.io/ci: "true"
    replicas: 1
    persistence:
      storage: "0"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 100m
        memory: 256Mi

Vhost:
  ci-vhost:
    annotations:
      hobops.io/ci: "true"
    name: vhost
    rabbitmqClusterReference:
      name: ci-topology-rmq
