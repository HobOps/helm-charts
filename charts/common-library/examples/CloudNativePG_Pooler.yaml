CNPGPooler:
  app-db-pooler-rw:
    labels:
      app.kubernetes.io/part-of: app
    cluster:
      name: app-db
    instances: 2
    type: rw
    pgbouncer:
      poolMode: transaction
      parameters:
        max_client_conn: "1000"
        default_pool_size: "20"
    monitoring:
      enablePodMonitor: true
    template:
      metadata:
        labels:
          app: app-db-pooler-rw
      spec:
        containers: []
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    cnpg.io/poolerName: app-db-pooler-rw
