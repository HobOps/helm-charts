CiliumBGPPeerConfig:
  gw1:
    labels:
      bgp: gw1
    authSecretRef: bgp-gw1-password
    ebgpMultihop: 1
    timers:
      connectRetryTimeSeconds: 12
      holdTimeSeconds: 9
      keepAliveTimeSeconds: 3
    gracefulRestart:
      enabled: true
      restartTimeSeconds: 120
    families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: c2
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          advertise: c2
