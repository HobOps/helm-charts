ExternalSecret:
  example-aws-parameterstore:
    refreshInterval: 1m
    secretStoreRef:
      kind: ClusterSecretStore
      name: aws-parameterstore
    labels:
      app.kubernetes.io/instance: example
    dataFrom:
    - extract: { key: '/test/example' }

  # ESO template placeholders ({{ .KEY }}) must survive Helm rendering.
  example-with-template:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault-backend
    target:
      name: rabbitmq-credentials
      creationPolicy: Owner
      template:
        engineVersion: v2
        data:
          username: "{{ .RABBITMQ_USER }}"
          password: "{{ .RABBITMQ_PASSWORD }}"
          default_user.conf: |
            default_user = {{ .RABBITMQ_USER }}
            default_pass = {{ .RABBITMQ_PASSWORD }}
    dataFrom:
    - extract:
        key: rabbitmq
