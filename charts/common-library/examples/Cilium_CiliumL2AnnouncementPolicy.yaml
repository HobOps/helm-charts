# Kind fixture for CiliumL2AnnouncementPolicy (cilium.io/v2alpha1, cluster-scoped).
CiliumL2AnnouncementPolicy:
  ci-l2policy:
    serviceSelector:
      matchLabels:
        lb-pool: lan
    nodeSelector:
      matchLabels:
        kubernetes.io/os: linux
    interfaces:
    - ^eth[0-9]+$
    loadBalancerIPs: true
    externalIPs: false
