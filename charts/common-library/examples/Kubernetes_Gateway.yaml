Gateway:
  main-gateway:
    annotations:
      annotation: main-gateway
    gatewayClassName: envoy-gateway
    # Labels/annotations the controller copies to the resources it creates
    # (e.g. Cilium's LoadBalancer Service: LB IPAM pool and a fixed IP).
    infrastructure:
      labels:
        lb-pool: gateway
      annotations:
        lbipam.cilium.io/ips: 192.0.2.29
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.example.com"
      tls:
        mode: Terminate
        certificateRefs:
        - name: example-tls
      allowedRoutes:
        namespaces:
          from: All
