{{- /*
  Kubernetes ReferenceGrant (Namespaced).
  Every key other than annotations / labels / apiVersion is rendered as the spec.
*/ -}}
{{- define "library.Kubernetes.ReferenceGrant" }}
{{- $data := .Values.ReferenceGrant }}
{{- $entry := index $data .name | default dict }}
---
apiVersion: {{ $entry.apiVersion | default "gateway.networking.k8s.io/v1" }}
kind: ReferenceGrant
metadata:
  name: {{ .name }}
  namespace: {{ .Release.Namespace }}
  {{- with $entry.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with $entry.labels }}
  labels:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  {{- tpl (toYaml (omit $entry "annotations" "labels" "apiVersion")) $ | nindent 2 }}
{{- end }}
