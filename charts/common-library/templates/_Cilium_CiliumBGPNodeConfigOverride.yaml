{{- /*
  Cilium CiliumBGPNodeConfigOverride (Cluster-scoped (no metadata.namespace)): per-node BGP settings (router ID, local ASN/port/address); the name must be the node name.
  Every key other than annotations / labels / apiVersion is rendered as the spec.
*/ -}}
{{- define "library.Cilium.CiliumBGPNodeConfigOverride" }}
{{- $data := .Values.CiliumBGPNodeConfigOverride }}
{{- $entry := index $data .name | default dict }}
---
apiVersion: {{ $entry.apiVersion | default "cilium.io/v2" }}
kind: CiliumBGPNodeConfigOverride
metadata:
  name: {{ .name }}
  {{- with $entry.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with $entry.labels }}
  labels:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  {{- tpl (toYaml (omit $entry "annotations" "labels" "apiVersion")) $ | nindent 2 }}
{{- end }}
