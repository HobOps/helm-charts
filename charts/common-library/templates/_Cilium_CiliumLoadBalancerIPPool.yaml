{{- /*
  Cilium CiliumLoadBalancerIPPool (Cluster-scoped (no metadata.namespace)).
  Every key other than annotations / labels / apiVersion is rendered as the spec.
*/ -}}
{{- define "library.Cilium.CiliumLoadBalancerIPPool" }}
{{- $data := .Values.CiliumLoadBalancerIPPool }}
{{- $entry := index $data .name | default dict }}
---
apiVersion: {{ $entry.apiVersion | default "cilium.io/v2" }}
kind: CiliumLoadBalancerIPPool
metadata:
  name: {{ .name }}
  {{- with $entry.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with $entry.labels }}
  labels:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  {{- tpl (toYaml (omit $entry "annotations" "labels" "apiVersion")) $ | nindent 2 }}
{{- end }}
