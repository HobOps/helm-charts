{{- define "library.CloudNativePG.Database" }}
{{- $data := .Values.CNPGDatabase }}
{{- $entry := index $data .name }}
---
apiVersion: {{ $entry.apiVersion | default "postgresql.cnpg.io/v1" }}
kind: Database
metadata:
  name: {{ .name }}
  namespace: {{ .Release.Namespace }}
  {{- with $entry.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with $entry.labels }}
  labels:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  {{- tpl (toYaml (omit $entry "annotations" "labels" "apiVersion")) $ | nindent 2 }}
{{- end }}
