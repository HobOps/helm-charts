{{- define "library.ExternalSecretsOperator.ExternalSecret" }}
{{- $data := .Values.ExternalSecret }}
{{- $entry := index $data .name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .Release.Namespace }}
  {{- with $entry.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with $entry.labels }}
  labels:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $entry.refreshInterval | default "1m"}}
  {{- with $entry.secretStoreRef }}
  secretStoreRef:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with $entry.target }}
  target:
    {{- if hasKey . "name" }}
    name: {{ tpl (printf "%v" .name) $ | quote }}
    {{- end }}
    {{- with .creationPolicy }}
    creationPolicy: {{ . }}
    {{- end }}
    {{- with .deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
    {{- if hasKey . "immutable" }}
    immutable: {{ .immutable }}
    {{- end }}
    {{- with .template }}
    template:
      {{- /* Do not run Helm tpl on template data: ESO placeholders use {{ .KEY }} */}}
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with $entry.data }}
  data:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with $entry.dataFrom }}
  dataFrom:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
{{- end }}
