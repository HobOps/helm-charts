{{- define "library.Kubernetes.Service" }}
{{- $data := .Values.Service }}

{{- /* Per-service values are read into locals, never stored in .Values:
       storing them there leaked fields from one service into the next one
       rendered in the same release (e.g. loadBalancerIP, sessionAffinityConfig).
       Workloads keep their layout: service fields under .service, and
       serviceAnnotations / serviceLabels / selectorLabels at the top level. */ -}}
{{- $svc := dict }}
{{- $annotations := dict }}
{{- $labels := dict }}
{{- $selector := dict }}
{{- if .Values.IsWorkload }}
  {{- $workload := index .Values.Workload .name | default dict }}
  {{- $svc = $workload.service | default dict }}
  {{- $annotations = $workload.serviceAnnotations | default dict }}
  {{- $labels = $workload.serviceLabels | default dict }}
  {{- $selector = $workload.selectorLabels | default dict }}
{{- else }}
  {{- $svc = index $data .name | default dict }}
  {{- $annotations = $svc.annotations | default dict }}
  {{- $labels = $svc.labels | default dict }}
  {{- $selector = $svc.selectorLabels | default dict }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ .Release.Namespace }}
  {{- with $annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with $labels }}
  labels:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type | default "ClusterIP" }}
  {{- if eq ($svc.type | default "") "ExternalName" }}
  externalName: {{ $svc.externalName }}
  {{- end }}
  {{- with $svc.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with $svc.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $svc.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- if hasKey $svc "allocateLoadBalancerNodePorts" }}
  allocateLoadBalancerNodePorts: {{ $svc.allocateLoadBalancerNodePorts }}
  {{- end }}
  {{- with $svc.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  sessionAffinity: {{ $svc.sessionAffinity | default "None" }}
  {{- with $svc.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  ports:
  {{- range $svc.ports }}
  - name: {{ .name }}
    {{- if .nodePort }}
    nodePort: {{ .nodePort }}
    {{- end }}
    port: {{ .port }}
    protocol: {{ .protocol }}
    targetPort: {{ .targetPort | default .port }}
  {{- end }}
  {{- with $selector }}
  selector:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
{{- end }}
